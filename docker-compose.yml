version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - 9092:9092
      - 29092:29092

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/urbanflow
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j_data:/data

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: urbanflow
      POSTGRES_DB: payments
    ports:
      - 5432:5432
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  postgres-audit:
    image: postgres:16
    environment:
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: urbanflow
      POSTGRES_DB: auditdb
    ports:
      - 5433:5433
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: urbanflow
      POSTGRES_DB: timescale
    ports:
      - 5434:5432
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  routing-service:
    image: node:20-alpine
    depends_on:
      - neo4j
    volumes:
      - ./backend/routing-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: urbanflow
    ports:
      - 3001:3001

  tracking-service:
    image: node:20-alpine
    depends_on:
      - kafka
      - redis
    volumes:
      - ./backend/tracking-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3002:3002

  payment-service:
    image: node:20-alpine
    depends_on:
      - postgres-payment
      - kafka
    volumes:
      - ./backend/payment-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PGHOST: postgres-payment
      PGUSER: urbanflow
      PGPASSWORD: urbanflow
      PGDATABASE: payments
      KAFKA_BROKER: kafka:9092
      AUDIT_URL: http://audit-service:3009/audit
    ports:
      - 3003:3003

  traffic-service:
    image: node:20-alpine
    depends_on:
      - kafka
    volumes:
      - ./backend/traffic-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      KAFKA_BROKER: kafka:9092
    ports:
      - 3004:3004

  micromobility-service:
    image: node:20-alpine
    depends_on:
      - redis
      - kafka
    volumes:
      - ./backend/micromobility-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3005:3005

  congestion-service:
    image: node:20-alpine
    depends_on:
      - timescaledb
      - kafka
      - postgres-audit
    volumes:
      - ./backend/congestion-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PGHOST: timescaledb
      PGUSER: urbanflow
      PGPASSWORD: urbanflow
      PGDATABASE: timescale
      KAFKA_BROKER: kafka:9092
      AUDIT_URL: http://audit-service:3009/audit
    ports:
      - 3006:3006

  notification-service:
    image: node:20-alpine
    depends_on:
      - kafka
    volumes:
      - ./backend/notification-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      KAFKA_BROKER: kafka:9092
    ports:
      - 3007:3007

  analytics-service:
    image: node:20-alpine
    depends_on:
      - timescaledb
    volumes:
      - ./backend/analytics-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PGHOST: timescaledb
      PGUSER: urbanflow
      PGPASSWORD: urbanflow
      PGDATABASE: timescale
    ports:
      - 3008:3008

  audit-service:
    image: node:20-alpine
    depends_on:
      - postgres-audit
    volumes:
      - ./backend/audit-service:/app
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      PGHOST: postgres-audit
      PGUSER: urbanflow
      PGPASSWORD: urbanflow
      PGDATABASE: auditdb
    ports:
      - 3009:3009

  frontend:
    image: nginx:alpine
    depends_on:
      - routing-service
      - tracking-service
      - payment-service
      - traffic-service
      - micromobility-service
      - congestion-service
      - notification-service
      - analytics-service
      - audit-service
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - 8080:80

volumes:
  neo4j_data:
  postgres_payment_data:
  postgres_audit_data:
  timescale_data:
  redis_data:
